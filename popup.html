<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 240px;
        padding: 16px;
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #18181b;
        color: #f4f4f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        background: #3b82f6;
        color: white;
        transition: background 0.2s;
      }
      button.active {
        background: #ef4444;
      }
      .section {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-size: 11px;
        color: #a1a1aa;
        display: flex;
        justify-content: space-between;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #3b82f6;
      }
      textarea {
        width: 100%;
        height: 50px;
        background: #27272a;
        color: #f4f4f5;
        border: 1px solid #3f3f46;
        border-radius: 4px;
        padding: 6px;
        font-size: 11px;
        resize: none;
        box-sizing: border-box;
      }
      .btn-row {
        display: flex;
        gap: 6px;
        width: 100%;
      }
      .secondary-btn {
        background: #27272a;
        border: 1px solid #3f3f46;
        padding: 6px;
        font-size: 11px;
        color: #f4f4f5;
        border-radius: 4px;
        cursor: pointer;
      }
      .secondary-btn:hover {
        background: #3f3f46;
      }
      span {
        font-size: 12px;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <button id="toggle-btn">Enable Dark Mode</button>
    <span id="status">Status: OFF</span>

    <div class="section">
      <label for="contrast-slider">
        <span>Contrast Intensity:</span>
        <span id="contrast-val">0.92</span>
      </label>
      <input type="range" id="contrast-slider" min="0.80" max="0.99" step="0.01" value="0.92" />
    </div>

    <div class="section">
      <label for="excluded-input">Excluded Domains:</label>
      <textarea id="excluded-input" placeholder="e.g. github.com"></textarea>
      <div class="btn-row">
        <button id="save-btn" class="secondary-btn" style="flex: 2">Save Exclusions</button>
        <button id="reset-btn" class="secondary-btn" style="flex: 1; color: #f87171">Reset</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
